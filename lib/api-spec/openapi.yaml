openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: civicai
    description: CivicAI conversation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /civicai/chat:
    post:
      operationId: chatWithCivicAI
      tags: [civicai]
      summary: Get civic guidance from CivicAI
      description: Sends a non-persistent conversation to the configured AI provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CivicAIChatInput"
      responses:
        "200":
          description: CivicAI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicAIChatResponse"
        "400":
          description: Invalid conversation
        "429":
          description: Rate limit reached
        "502":
          description: AI provider request failed
        "503":
          description: AI provider is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CivicAIMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - role
        - content
    CivicAIChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CivicAIMessage"
      required:
        - messages
    CivicAIChatResponse:
      type: object
      properties:
        answer:
          type: string
      required:
        - answer

